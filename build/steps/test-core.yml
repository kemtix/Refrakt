parameters:
  publishTestResults: false

steps:
- powershell: |
   dotnet test $(System.DefaultWorkingDirectory)\tests\Refrakt.Core.Tests\Refrakt.Core.Tests.csproj --configuration $env:BuildConfiguration --logger trx --no-build --collect "Code Coverage"

  displayName: Test Refrakt.Core

- template: publish-vstest-results.yml
  parameters:
    enabled: ${{ parameters.publishTestResults }}
    testRunTitle: Refrakt.Core
    testResultsFiles: '$(System.DefaultWorkingDirectory)/tests/Refrakt.Core.Tests/TestResults/*.trx'