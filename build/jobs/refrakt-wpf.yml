jobs:
- job: refraktWpf
  displayName: Refrakt.Wpf
  pool:
    vmImage: $(VMImage)
    demands:
    - MSBuild
  workspace:
    clean: all
  steps:
  - template: ../steps/build.yml
    parameters:
      solution: Refrakt_Wpf.sln
      solutionName: Refrakt.WPF

  - template: ../steps/test-wpf.yml
    parameters:
      publishTestResults: true