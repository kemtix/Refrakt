name: Bug report
description: Report a problem in Refrakt
title: "[Bug] "
labels: ["bug", "to verify"]
body:
  - type: markdown
    attributes:
      value: |
        Bug reports without a reproduction sample will be closed.
        Please search the open and closed issues before reporting a new one.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the problem?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version with issue
      placeholder: e.g. 8.1.98
    validations:
      required: true
  - type: input
    id: last-good-version
    attributes:
      label: Last known good version
  - type: dropdown
    id: package
    attributes:
      label: Package
      multiple: true
      options:
        - Refrakt.Core
        - Refrakt.Wpf
        - Refrakt.DryIoc
  - type: input
    id: framework
    attributes:
      label: Target framework
      placeholder: e.g. net5.0-windows, net472
  - type: input
    id: ide
    attributes:
      label: IDE
      placeholder: e.g. Visual Studio 2022 17.x
  - type: input
    id: reproduction
    attributes:
      label: Reproduction Link
      description: Link to a minimal project that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: For visual issues, add screenshots showing the problem.
